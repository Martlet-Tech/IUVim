<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>IUV 输入法：键盘输入 → 预编辑/候选列表 处理流程图</title>
<style>
  :root {
    --fg: #24292f;
    --muted: #6e7781;
    --line: #d0d7de;
    --node-bg: #f6f8fa;
    --node-border: #57606a;
    --decision-bg: #fff8e6;
    --decision-border: #d4a72c;
    --start-bg: #e6f6ec;
    --start-border: #1a7f37;
    --exit-bg: #fbe3e4;
    --exit-border: #cf222e;
    --arrow: #57606a;
    --label: #57606a;
    --tooltip-bg: #ffffff;
    --tooltip-border: #d0d7de;
    --tooltip-shadow: rgba(31,35,40,0.18);
    --code-bg: #f0f2f4;
  }
  body { margin: 0; padding: 24px; font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; color: var(--fg); background: #fcfcfd; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .legend { display: flex; gap: 18px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lg-rect { display: inline-block; width: 22px; height: 14px; border: 1.5px solid var(--node-border); background: var(--node-bg); border-radius: 4px; }
  .lg-dia { display: inline-block; width: 22px; height: 22px; border: 1.5px solid var(--decision-border); background: var(--decision-bg); transform: rotate(45deg) scale(0.6); margin: 0 2px; }
  .lg-start { display: inline-block; width: 40px; height: 16px; border: 1.5px solid var(--start-border); background: var(--start-bg); border-radius: 10px; }
  .lg-exit { display: inline-block; width: 22px; height: 14px; border: 1.5px solid var(--exit-border); background: var(--exit-bg); border-radius: 4px; }
  .scroll-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  svg { display: block; margin: 0 auto; }
  /* 节点 */
  .node rect, .node polygon { cursor: help; transition: filter .12s; }
  .node:hover rect, .node:hover polygon { filter: drop-shadow(0 1px 3px rgba(31,35,40,0.28)); }
  .node text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; pointer-events: none; user-select: none; }
  .node .t-main { font-size: 14px; font-weight: 600; fill: var(--fg); }
  .node .t-sub { font-size: 11.5px; fill: var(--muted); }
  .proc rect { fill: var(--node-bg); stroke: var(--node-border); stroke-width: 1.5; }
  .decision polygon { fill: var(--decision-bg); stroke: var(--decision-border); stroke-width: 1.5; }
  .start rect { fill: var(--start-bg); stroke: var(--start-border); stroke-width: 1.5; rx: 26; }
  .exit rect { fill: var(--exit-bg); stroke: var(--exit-border); stroke-width: 1.5; }
  /* 连线 */
  .edge { stroke: var(--arrow); stroke-width: 1.6; fill: none; }
  .edge.loop { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
  .elabel { font-size: 12px; font-weight: 600; fill: var(--label); }
  /* 工具提示 */
  #tip { position: fixed; display: none; max-width: 420px; background: var(--tooltip-bg); border: 1px solid var(--tooltip-border); border-radius: 8px; box-shadow: 0 6px 20px var(--tooltip-shadow); padding: 12px 14px; font-size: 13px; line-height: 1.55; z-index: 99; pointer-events: none; }
  #tip h4 { margin: 0 0 6px; font-size: 14px; }
  #tip p { margin: 0 0 8px; }
  #tip p:last-child { margin-bottom: 0; }
  #tip pre { background: var(--code-bg); border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 12px; overflow-x: auto; }
  #tip .ref { color: var(--muted); font-size: 11.5px; }
  #tip code { background: var(--code-bg); border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<h1>IUV 输入法：键盘输入 → 预编辑 / 候选列表 处理流程</h1>
<div class="sub">悬停任意节点查看详细说明与示例 · 依据 main 分支（M6 daemon / M4 渲染已并入）</div>
<div class="legend">
  <span><i class="lg-rect"></i>处理步骤</span>
  <span><i class="lg-dia"></i>分支判定</span>
  <span><i class="lg-start"></i>入口</span>
  <span><i class="lg-exit"></i>直通/结束</span>
</div>
<div class="scroll-wrap">
<svg viewBox="0 0 900 2020" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- ========== 连线 ========== -->
  <path class="edge" d="M360,74 L360,96" marker-end="url(#arrow)"/>
  <path class="edge" d="M360,184 L360,196" marker-end="url(#arrow)"/>
  <path class="edge" d="M470,140 L685,118" marker-end="url(#arrow)"/>
  <text class="elabel" x="492" y="132">是</text>
  <path class="edge" d="M360,284 L360,296" marker-end="url(#arrow)"/>
  <path class="edge" d="M470,240 L685,218" marker-end="url(#arrow)"/>
  <text class="elabel" x="492" y="232">是</text>
  <path class="edge" d="M360,354 L360,396" marker-end="url(#arrow)"/>
  <!-- 会话已存在：是 → on_key；否 → 是字母键 -->
  <path class="edge" d="M360,484 L360,516" marker-end="url(#arrow)"/>
  <text class="elabel" x="318" y="506">否</text>
  <path class="edge" d="M470,440 L590,440 L590,716 L360,716" marker-end="url(#arrow)"/>
  <text class="elabel" x="505" y="455">是</text>
  <path class="edge" d="M360,604 L360,616" marker-end="url(#arrow)"/>
  <text class="elabel" x="318" y="612">是</text>
  <path class="edge" d="M470,560 L685,538" marker-end="url(#arrow)"/>
  <text class="elabel" x="492" y="552">否</text>
  <path class="edge" d="M360,674 L360,716" marker-end="url(#arrow)"/>
  <!-- on_key → 三类按键 -->
  <path class="edge" d="M360,774 L150,816" marker-end="url(#arrow)"/>
  <path class="edge" d="M360,774 L360,816" marker-end="url(#arrow)"/>
  <path class="edge" d="M360,774 L570,816" marker-end="url(#arrow)"/>
  <!-- 三类按键 → recompute -->
  <path class="edge" d="M150,874 L150,916" marker-end="url(#arrow)"/>
  <path class="edge" d="M360,874 L360,916" marker-end="url(#arrow)"/>
  <path class="edge" d="M570,874 L570,916" marker-end="url(#arrow)"/>
  <!-- recompute → 路由分类 -->
  <path class="edge" d="M360,974 L360,1016" marker-end="url(#arrow)"/>
  <!-- 路由分类 → 三路 -->
  <path class="edge" d="M190,1074 L150,1146" marker-end="url(#arrow)"/>
  <path class="edge" d="M360,1074 L360,1146" marker-end="url(#arrow)"/>
  <path class="edge" d="M530,1074 L570,1146" marker-end="url(#arrow)"/>
  <!-- 三路 → 候选处理 -->
  <path class="edge" d="M150,1204 L150,1216" marker-end="url(#arrow)"/>
  <path class="edge" d="M360,1204 L360,1216" marker-end="url(#arrow)"/>
  <path class="edge" d="M570,1204 L570,1216" marker-end="url(#arrow)"/>
  <!-- 候选处理 → 空判断 -->
  <path class="edge" d="M360,1274 L360,1316" marker-end="url(#arrow)"/>
  <!-- 空判断 → 正常/原文 -->
  <path class="edge" d="M250,1360 L250,1416" marker-end="url(#arrow)"/>
  <text class="elabel" x="196" y="1390">否</text>
  <path class="edge" d="M470,1360 L470,1416" marker-end="url(#arrow)"/>
  <text class="elabel" x="452" y="1390">是</text>
  <!-- 正常/原文 → Effect -->
  <path class="edge" d="M250,1474 L250,1500 L360,1500 L360,1516" marker-end="url(#arrow)"/>
  <path class="edge" d="M490,1474 L490,1500 L360,1500"/>
  <!-- Effect → 消费判断 -->
  <path class="edge" d="M360,1574 L360,1616" marker-end="url(#arrow)"/>
  <!-- 消费判断 → 悬空/Commit -->
  <path class="edge" d="M250,1660 L250,1716" marker-end="url(#arrow)"/>
  <text class="elabel" x="196" y="1690">否</text>
  <path class="edge" d="M470,1660 L470,1716" marker-end="url(#arrow)"/>
  <text class="elabel" x="452" y="1690">是</text>
  <!-- 悬空 → 更新预编辑+候选窗 -->
  <path class="edge" d="M250,1774 L250,1800 L360,1800 L360,1816" marker-end="url(#arrow)"/>
  <!-- Commit → 更新预编辑+候选窗 -->
  <path class="edge" d="M490,1774 L490,1800 L360,1800"/>
  <!-- 循环回 on_key -->
  <path class="edge loop" d="M145,1845 L40,1845 L40,745 L145,745" marker-end="url(#arrow)"/>
  <text class="elabel" x="92" y="736" text-anchor="middle">等待下一按键</text>

  <!-- ========== 节点 ========== -->
  <!-- 1 入口 -->
  <g class="node start" data-tip="&lt;h4&gt;键盘事件（TSF OnKeyDown）&lt;/h4&gt;&lt;p&gt;TSF 把系统键盘事件分发给输入法，这里是 IME 的唯一入口。handle_key_down 先做前置检查（英文模式 / 直通白名单 / 会话状态），再进入引擎。&lt;/p&gt;&lt;pre&gt;notepad 里按 'n' → ITfKeyEventSink::OnKeyDown → handle_key_down&lt;/pre&gt;&lt;p class='ref'&gt;参考：text_service.rs:348&lt;/p&gt;">
    <rect x="245" y="16" width="230" height="58"/>
    <text class="t-main" x="360" y="40" text-anchor="middle">键盘事件</text>
    <text class="t-sub" x="360" y="58" text-anchor="middle">TSF OnKeyDown</text>
  </g>

  <!-- 2 英文模式 -->
  <g class="node decision" data-tip="&lt;h4&gt;英文模式？&lt;/h4&gt;&lt;p&gt;由系统「输入法 / 非输入法切换」（Ctrl+Space）驱动的 compartment 状态。英文模式下所有按键直接放行，不建会话、无预编辑 / 候选窗。&lt;/p&gt;&lt;pre&gt;英文模式按 'n' → 直接上屏 n&lt;br&gt;切回中文后 'n' 才进会话&lt;/pre&gt;&lt;p class='ref'&gt;参考：english_mode / OPENCLOSE compartment&lt;/p&gt;">
    <polygon points="360,96 470,140 360,184 250,140"/>
    <text class="t-main" x="360" y="145" text-anchor="middle">英文模式？</text>
  </g>

  <!-- 直通1 -->
  <g class="node exit" data-tip="&lt;h4&gt;放行给应用（直通）&lt;/h4&gt;&lt;p&gt;按键不消费，直接交给应用程序处理——无预编辑、无候选窗、不建会话。输入法在该按键上完全透明。&lt;/p&gt;">
    <rect x="685" y="96" width="150" height="44"/>
    <text class="t-main" x="760" y="117" text-anchor="middle">放行给应用</text>
    <text class="t-sub" x="760" y="131" text-anchor="middle">（直通）</text>
  </g>

  <!-- 3 直通白名单 -->
  <g class="node decision" data-tip="&lt;h4&gt;进程在直通名单？&lt;/h4&gt;&lt;p&gt;config.json 的 passthrough_apps（exe 名列表，大小写不敏感精确匹配）。命中进程全部按键放行——游戏 WASD 直达、输入法完全透明。名单为空时零开销（不查进程名）。&lt;/p&gt;&lt;pre&gt;["wow.exe"] → 魔兽世界里输入法完全不出现&lt;/pre&gt;&lt;p class='ref'&gt;参考：passthrough_apps / session_bridge::is_passthrough_app&lt;/p&gt;">
    <polygon points="360,196 470,240 360,284 250,240"/>
    <text class="t-main" x="360" y="235" text-anchor="middle">进程在直通</text>
    <text class="t-main" x="360" y="253" text-anchor="middle">名单？</text>
  </g>

  <!-- 直通2 -->
  <g class="node exit" data-tip="&lt;h4&gt;放行给应用（直通）&lt;/h4&gt;&lt;p&gt;命中白名单进程，按键全部放行，不建会话、无候选窗 / 预编辑。边界：名单内进程无法用中文输入。&lt;/p&gt;">
    <rect x="685" y="196" width="150" height="44"/>
    <text class="t-main" x="760" y="217" text-anchor="middle">放行给应用</text>
    <text class="t-sub" x="760" y="231" text-anchor="middle">（直通）</text>
  </g>

  <!-- 4 map_key -->
  <g class="node proc" data-tip="&lt;h4&gt;map_key 归一化&lt;/h4&gt;&lt;p&gt;把 VK 键码 + Shift / CapsLock / Ctrl / Alt 状态归一化成 Key 枚举（Char / ShiftChar / Backspace / SwapLeft 等）。大写字母保形进序列（Key::ShiftChar）：匹配只认小写，commit 原样上屏。&lt;/p&gt;&lt;pre&gt;VK_A + Shift → ShiftChar('A')&lt;br&gt;VK_BACK → Backspace&lt;br&gt;Shift + ← → SwapLeft&lt;/pre&gt;&lt;p class='ref'&gt;参考：session_bridge.rs:26&lt;/p&gt;">
    <rect x="245" y="296" width="230" height="58"/>
    <text class="t-main" x="360" y="320" text-anchor="middle">map_key 归一化</text>
    <text class="t-sub" x="360" y="338" text-anchor="middle">VK 键码 → Key 枚举</text>
  </g>

  <!-- 5 会话已存在 -->
  <g class="node decision" data-tip="&lt;h4&gt;会话已存在？&lt;/h4&gt;&lt;p&gt;首个字母建会话（引擎状态机 + TSF composition），此后按键进入同一会话直到上屏 / 取消。会话外只有字母能开会话；CapsLock 生效时会话外字母放行直通（仿微软 Caps = 英文模式，不建会话→游戏无预编辑 / 候选窗）。&lt;/p&gt;&lt;pre&gt;敲 'nihao' = 同一会话连续 5 次 on_key&lt;br&gt;中途 Alt+Tab 切窗口 → 会话按原文上屏结束&lt;/pre&gt;&lt;p class='ref'&gt;参考：is_session_start_key / caps_passthrough&lt;/p&gt;">
    <polygon points="360,396 470,440 360,484 250,440"/>
    <text class="t-main" x="360" y="435" text-anchor="middle">会话已存在？</text>
    <text class="t-main" x="360" y="453" text-anchor="middle">（拼音会话）</text>
  </g>

  <!-- 6 是字母键 -->
  <g class="node decision" data-tip="&lt;h4&gt;是字母键（开会话）？&lt;/h4&gt;&lt;p&gt;只有字母（含大写）能开启新会话；数字 / 符号 / 功能键在会话外直接放行给应用。CapsLock 生效时字母放行直通（英文模式语义）。&lt;/p&gt;&lt;pre&gt;会话外按 '2' → 上屏数字 2&lt;br&gt;会话外按 'n' → 开会话，预编辑显示 n&lt;/pre&gt;&lt;p class='ref'&gt;参考：keymap::is_session_start_key&lt;/p&gt;">
    <polygon points="360,516 470,560 360,604 250,560"/>
    <text class="t-main" x="360" y="555" text-anchor="middle">是字母键？</text>
    <text class="t-main" x="360" y="573" text-anchor="middle">（开会话）</text>
  </g>

  <!-- 直通3 -->
  <g class="node exit" data-tip="&lt;h4&gt;放行给应用（直通）&lt;/h4&gt;&lt;p&gt;非字母键 / CapsLock 生效时的字母，会话外直接放行，不建会话。&lt;/p&gt;">
    <rect x="685" y="516" width="150" height="44"/>
    <text class="t-main" x="760" y="537" text-anchor="middle">放行给应用</text>
    <text class="t-sub" x="760" y="551" text-anchor="middle">（直通）</text>
  </g>

  <!-- 7 start_session -->
  <g class="node proc" data-tip="&lt;h4&gt;start_session + Composition&lt;/h4&gt;&lt;p&gt;引擎建立会话状态机（raw 初始为空）；TSF 侧创建 Composition 对象（首次 set_text 时 StartComposition），预编辑由此接管。之后每个键都先 on_key 推进会话、再应用返回的 Effect。&lt;/p&gt;&lt;pre&gt;首次输入 'n' → composition 建立，预编辑显示 &quot;n&quot;&lt;/pre&gt;&lt;p class='ref'&gt;参考：engine::start_session / composition.rs:new&lt;/p&gt;">
    <rect x="245" y="616" width="230" height="58"/>
    <text class="t-main" x="360" y="640" text-anchor="middle">start_session +</text>
    <text class="t-sub" x="360" y="658" text-anchor="middle">Composition::new</text>
  </g>

  <!-- 8 on_key -->
  <g class="node proc" data-tip="&lt;h4&gt;session.on_key(key)&lt;/h4&gt;&lt;p&gt;会话状态机推进一次按键：字母追加进 raw、退格删尾 / 弹已选词、数字选词、空格 / 回车上屏、翻页与导航、Shift+←/→ 调权、Shift+Del 隐藏。返回完整 Effect 快照（UI 状态 + 可能的副作用）。&lt;/p&gt;&lt;pre&gt;敲 'i' → raw=&quot;i&quot;，recompute 出候选&lt;br&gt;敲 Backspace → 删 raw 尾字符后重算&lt;/pre&gt;&lt;p class='ref'&gt;参考：session.rs:34&lt;/p&gt;">
    <rect x="145" y="716" width="430" height="58"/>
    <text class="t-main" x="360" y="740" text-anchor="middle">session.on_key(key)</text>
    <text class="t-sub" x="360" y="758" text-anchor="middle">→ 返回 Effect 快照（不读引擎内部）</text>
  </g>

  <!-- 9a 修改类 -->
  <g class="node proc" data-tip="&lt;h4&gt;字母 / 退格 / 调权 / 隐藏&lt;/h4&gt;&lt;p&gt;修改会话内部状态（raw 字符串 / 已选词栈 / 用户权重），随后 recompute 重新生成候选。不结束会话。&lt;/p&gt;&lt;pre&gt;字母 → raw 追加字符&lt;br&gt;Backspace → 删 raw 尾；有已选词则弹栈拼回&lt;br&gt;Shift+→ → 与右侧候选交换权重（绝对值覆盖，持久化）&lt;br&gt;Shift+Del → 隐藏候选（先删用户库条目，否则屏蔽基础库）&lt;/pre&gt;&lt;p class='ref'&gt;参考：session.rs:60-166&lt;/p&gt;">
    <rect x="65" y="816" width="170" height="58"/>
    <text class="t-main" x="150" y="840" text-anchor="middle">字母 / 退格</text>
    <text class="t-sub" x="150" y="858" text-anchor="middle">调权 / 隐藏</text>
  </g>

  <!-- 9b 选词 -->
  <g class="node proc" data-tip="&lt;h4&gt;数字 / 空格（选候选）&lt;/h4&gt;&lt;p&gt;数字 1-9 或空格选择候选 → commit_index：全消费则上屏并结束会话；部分消费则已选词入栈（悬空）、尾巴续接。&lt;/p&gt;&lt;pre&gt;敲 &quot;nihao&quot; 后按 1 → &quot;你好&quot; 上屏&lt;br&gt;按空格 → 选当前高亮候选&lt;/pre&gt;&lt;p class='ref'&gt;参考：session.rs:81-95 / commit_index&lt;/p&gt;">
    <rect x="275" y="816" width="170" height="58"/>
    <text class="t-main" x="360" y="840" text-anchor="middle">数字 / 空格</text>
    <text class="t-sub" x="360" y="858" text-anchor="middle">选候选</text>
  </g>

  <!-- 9c 翻页 -->
  <g class="node proc" data-tip="&lt;h4&gt;翻页 / 导航&lt;/h4&gt;&lt;p&gt;↑/← 上一个、↓/→ 下一个、PageUp/PageDown（或逗号/句号）翻页。只移动 page / selected，不重算候选——视觉由候选窗本地重绘。页尾环绕：页尾继续 → 翻下一页，页首回退 → 翻上一页。&lt;/p&gt;&lt;pre&gt;PageDown → 翻到第 2 页（page=1, selected=0）&lt;br&gt;→ → 页内高亮下移一个&lt;/pre&gt;&lt;p class='ref'&gt;参考：session.rs:262 move_selected&lt;/p&gt;">
    <rect x="485" y="816" width="170" height="58"/>
    <text class="t-main" x="570" y="840" text-anchor="middle">翻页 / 导航</text>
    <text class="t-sub" x="570" y="858" text-anchor="middle">改页与高亮</text>
  </g>

  <!-- 10 recompute -->
  <g class="node proc" data-tip="&lt;h4&gt;recompute() 核心重算&lt;/h4&gt;&lt;p&gt;每次 raw 变化触发：&lt;b&gt;①&lt;/b&gt; schema.segment 音节切分，产出全部切分方案（plans）；&lt;b&gt;②&lt;/b&gt; rank_plans 按词频重排，方案[0] 为最可能分节；&lt;b&gt;③&lt;/b&gt; generate_candidates 按最优方案生成候选。随后 page=0、selected=0。&lt;/p&gt;&lt;pre&gt;&quot;keneng&quot; → 方案 [ke'neng] 而非 [ken'eng]&lt;br&gt;&quot;xi'an&quot; → 强制撇号参与分节（xi'an）&lt;br&gt;简拼整词 / 简拼键 / 前缀档不跟随分节预览&lt;/pre&gt;&lt;p class='ref'&gt;参考：session.rs:245&lt;/p&gt;">
    <rect x="145" y="916" width="430" height="58"/>
    <text class="t-main" x="360" y="940" text-anchor="middle">recompute()</text>
    <text class="t-sub" x="360" y="958" text-anchor="middle">① segment 切分 → ② rank_plans 重排 → ③ 生成候选</text>
  </g>

  <!-- 11 路由 -->
  <g class="node proc" data-tip="&lt;h4&gt;generate_candidates 路由分类&lt;/h4&gt;&lt;p&gt;按输入形态三路分发（classify）：单段档 / 多段全完整档 / 纯简拼档 / 混拼档，各自生成策略不同。之后统一走去重 → 截断 → rerank 管线。&lt;/p&gt;&lt;pre&gt;&quot;c&quot; 单段前缀 · &quot;ce&quot; 完整音节 · &quot;nihao&quot; 全拼&lt;br&gt;&quot;nh&quot; 纯简拼 · &quot;nhao&quot; 混拼&lt;/pre&gt;&lt;p class='ref'&gt;参考：engine.rs:426&lt;/p&gt;">
    <rect x="145" y="1016" width="430" height="58"/>
    <text class="t-main" x="360" y="1040" text-anchor="middle">generate_candidates</text>
    <text class="t-sub" x="360" y="1058" text-anchor="middle">按输入形态分类路由</text>
  </g>

  <!-- 12a 单段 -->
  <g class="node proc" data-tip="&lt;h4&gt;单段档 → 纯单字&lt;/h4&gt;&lt;p&gt;完整音节走 dict.exact_single 返回全部同音字（词频序）；严格前缀走首字母桶过滤（桶只收单字）。无论完整与否只出单字——微软实测对齐（shi 只出 是 时 十 使…，无「时间 / 时候」）。候选全量返回不截断，翻页可达。&lt;/p&gt;&lt;pre&gt;&quot;shi&quot; → 是 时 十 使 事 …&lt;br&gt;&quot;sh&quot; → 首字母桶 top-500 里过滤前缀&lt;/pre&gt;&lt;p class='ref'&gt;参考：engine.rs:525&lt;/p&gt;">
    <rect x="65" y="1146" width="170" height="58"/>
    <text class="t-main" x="150" y="1170" text-anchor="middle">单段档</text>
    <text class="t-sub" x="150" y="1188" text-anchor="middle">纯单字（词频序）</text>
  </g>

  <!-- 12b 全拼 -->
  <g class="node proc" data-tip="&lt;h4&gt;多段全拼 → k-loop&lt;/h4&gt;&lt;p&gt;多段全完整档：按段数从长到短逐级「砍尾巴」前缀查询（k=n..1），生成从长到短的候选；整句遍历所有切分方案（viterbi 语义）。词 / 字混合。&lt;/p&gt;&lt;pre&gt;&quot;nihao&quot; → &quot;你好&quot;(2段) + &quot;你&quot;&quot;好&quot; 单字&lt;br&gt;&quot;xi'an&quot; → 选「西安」或「西」+续接 an&lt;/pre&gt;&lt;p class='ref'&gt;参考：full_pinyin_candidates&lt;/p&gt;">
    <rect x="275" y="1146" width="170" height="58"/>
    <text class="t-main" x="360" y="1170" text-anchor="middle">多段全拼</text>
    <text class="t-sub" x="360" y="1188" text-anchor="middle">k-loop 砍尾巴前缀</text>
  </g>

  <!-- 12c 简拼/混拼 -->
  <g class="node proc" data-tip="&lt;h4&gt;简拼 / 混拼&lt;/h4&gt;&lt;p&gt;纯简拼档（nh / nhm / nhmsx）：构建期简拼键逐级砍尾巴，纯词、任意长度、部分消费尾巴续接复用悬空机制。混拼档（nhao）：简拼段运行时展开成音节笛卡尔配对，单级 ≤2000 查询剪枝。&lt;/p&gt;&lt;pre&gt;&quot;nh&quot; → 你好&lt;br&gt;&quot;nhao&quot; → 简拼 n × 完整 hao&lt;br&gt;&quot;nhmsx&quot; → 你妹妹生肖…&lt;/pre&gt;&lt;p class='ref'&gt;参考：engine.rs abbrev/mixed_candidates&lt;/p&gt;">
    <rect x="485" y="1146" width="170" height="58"/>
    <text class="t-main" x="570" y="1170" text-anchor="middle">简拼 / 混拼</text>
    <text class="t-sub" x="570" y="1188" text-anchor="middle">砍尾 / 笛卡尔配对</text>
  </g>

  <!-- 13 候选处理 -->
  <g class="node proc" data-tip="&lt;h4&gt;候选列表处理（管线）&lt;/h4&gt;&lt;p&gt;物化候选后依次：&lt;b&gt;①&lt;/b&gt; 按 text 去重（保序，先见先留）；&lt;b&gt;②&lt;/b&gt; 截断到 max_candidates；&lt;b&gt;③&lt;/b&gt; 依次过 rerank stages 管线——用户库覆盖表叠加（自造词权重 8000、绝对值调权在此生效）。&lt;/p&gt;&lt;pre&gt;自造词 → 权重 8000 插入（无命中场景）&lt;br&gt;Shift+→ 交换 → 立即重排，高亮跟随被调词&lt;/pre&gt;&lt;p class='ref'&gt;参考：engine.rs:468-487 / dict.rs merged&lt;/p&gt;">
    <rect x="145" y="1216" width="430" height="58"/>
    <text class="t-main" x="360" y="1240" text-anchor="middle">候选列表处理</text>
    <text class="t-sub" x="360" y="1258" text-anchor="middle">去重 → 截断 → rerank 管线（用户库叠加）</text>
  </g>

  <!-- 14 空判断 -->
  <g class="node decision" data-tip="&lt;h4&gt;候选为空且输入非空？&lt;/h4&gt;&lt;p&gt;任何路由都打不到词库的输入（如 input / window / i），generate_candidates 末尾补一条原文候选：去撇号、seg_len 全消费、1/Space 直接上屏。候选窗内容恒非空——修复英文输入时全空候选框的 bug。&lt;/p&gt;&lt;pre&gt;敲 &quot;window&quot; 无词 → 候选显示原文 window&lt;br&gt;（UI 不编号呈现，传达「不认识」语义）&lt;/pre&gt;&lt;p class='ref'&gt;参考：engine.rs:493&lt;/p&gt;">
    <polygon points="360,1316 470,1360 360,1404 250,1360"/>
    <text class="t-main" x="360" y="1355" text-anchor="middle">候选为空且</text>
    <text class="t-main" x="360" y="1373" text-anchor="middle">输入非空？</text>
  </g>

  <!-- 15a 正常 -->
  <g class="node proc" data-tip="&lt;h4&gt;正常候选&lt;/h4&gt;&lt;p&gt;词频序 + 用户调权后的常规候选列表，进入 Effect 输出。&lt;/p&gt;&lt;pre&gt;nihao → 你好 妮好 拟好 …&lt;/pre&gt;">
    <rect x="150" y="1416" width="200" height="58"/>
    <text class="t-main" x="250" y="1440" text-anchor="middle">正常候选</text>
    <text class="t-sub" x="250" y="1458" text-anchor="middle">（词频 / 调权序）</text>
  </g>

  <!-- 15b 原文 -->
  <g class="node proc" data-tip="&lt;h4&gt;原文候选兜底&lt;/h4&gt;&lt;p&gt;「不认识」语义：候选文本 = 预编辑原文去撇号。UI 判定 text == 原文则不编号呈现。1 / Space 直接上屏原文。&lt;/p&gt;&lt;pre&gt;window → 候选显示 window，不编号&lt;/pre&gt;&lt;p class='ref'&gt;参考：engine.rs:493-506 / ui/gdi 判定&lt;/p&gt;">
    <rect x="390" y="1416" width="200" height="58"/>
    <text class="t-main" x="490" y="1440" text-anchor="middle">原文候选兜底</text>
    <text class="t-sub" x="490" y="1458" text-anchor="middle">（「不认识」语义）</text>
  </g>

  <!-- 16 Effect -->
  <g class="node proc" data-tip="&lt;h4&gt;Effect 快照&lt;/h4&gt;&lt;p&gt;一次按键的完整 UI 输出：&lt;b&gt;composition&lt;/b&gt;（预编辑拼音分段）、&lt;b&gt;reading&lt;/b&gt;（切分显示）、&lt;b&gt;candidates&lt;/b&gt;（当前页候选）、&lt;b&gt;all_candidates&lt;/b&gt;（全量，喂 TSF 候选 UI 元素 / WoW 游戏内候选栏）、&lt;b&gt;selected / page / end&lt;/b&gt;。TSF 层只消费它，不读引擎内部。&lt;/p&gt;&lt;pre&gt;{ composition: &quot;ce'shi&quot;, candidates: [测试, 厕所, …],&lt;br&gt;  page: 0, selected: 0, end: None }&lt;/pre&gt;&lt;p class='ref'&gt;参考：key.rs:115&lt;/p&gt;">
    <rect x="145" y="1516" width="430" height="58"/>
    <text class="t-main" x="360" y="1540" text-anchor="middle">Effect 快照</text>
    <text class="t-sub" x="360" y="1558" text-anchor="middle">composition / reading / candidates / selected / page / end</text>
  </g>

  <!-- 17 消费判断 -->
  <g class="node decision" data-tip="&lt;h4&gt;消费完整段？&lt;/h4&gt;&lt;p&gt;commit 判定：候选 seg_len ≥ 有效段数 = 全消费 → 上屏并结束会话；否则 = 部分消费 → 已选词入栈（悬空，不上屏）、尾巴续接。&lt;/p&gt;&lt;pre&gt;&quot;nihao&quot; 选「你好」(seg_len=2) → 全消费，上屏结束&lt;br&gt;&quot;xi'an&quot; 选「系」(seg_len=1) → 悬空「系」+ 续接 an&lt;/pre&gt;&lt;p class='ref'&gt;参考：session.rs:191 commit_index&lt;/p&gt;">
    <polygon points="360,1616 470,1660 360,1704 250,1660"/>
    <text class="t-main" x="360" y="1655" text-anchor="middle">消费完整段？</text>
    <text class="t-main" x="360" y="1673" text-anchor="middle">seg_len == 段数</text>
  </g>

  <!-- 18a 悬空 -->
  <g class="node proc" data-tip="&lt;h4&gt;悬空续接&lt;/h4&gt;&lt;p&gt;已选词入栈（不产生任何 commit 信号），尾巴 raw 续接重算。预编辑混合显示：汉字 + 剩余拼音分节。Esc 语义：有已选词时先上屏已选词。&lt;/p&gt;&lt;pre&gt;选「床」→ 预编辑：床 qian'guang…&lt;br&gt;继续打 yue → 续出「月光」&lt;/pre&gt;&lt;p class='ref'&gt;参考：session.rs:209-215&lt;/p&gt;">
    <rect x="150" y="1716" width="200" height="58"/>
    <text class="t-main" x="250" y="1740" text-anchor="middle">悬空续接</text>
    <text class="t-sub" x="250" y="1758" text-anchor="middle">已选词入栈，尾巴续接</text>
  </g>

  <!-- 18b Commit -->
  <g class="node proc" data-tip="&lt;h4&gt;Commit 上屏&lt;/h4&gt;&lt;p&gt;SetText + EndComposition 全量替换上屏（picked 已选词 + 本次词拼接），会话结束。composition 全程单个、只做全量更新，End→Start 窗口不存在。&lt;/p&gt;&lt;pre&gt;床前明月光 全消费 → 一次上屏整句&lt;/pre&gt;&lt;p class='ref'&gt;参考：composition.rs:79 / 2026-08-11 悬空修复&lt;/p&gt;">
    <rect x="390" y="1716" width="200" height="58"/>
    <text class="t-main" x="490" y="1740" text-anchor="middle">Commit 上屏</text>
    <text class="t-sub" x="490" y="1758" text-anchor="middle">SetText + EndComposition</text>
  </g>

  <!-- 19 更新 -->
  <g class="node proc" data-tip="&lt;h4&gt;更新预编辑 + 候选窗重绘&lt;/h4&gt;&lt;p&gt;composition.set_text 全量更新预编辑文本（必要时先 StartComposition）；候选窗按 Effect 重绘（M4：tiny-skia 绘制 + cosmic-text 排版 + ULW 呈现，浅 / 深主题）。随后等待下一按键进入 on_key（虚线循环）。&lt;/p&gt;&lt;pre&gt;每敲一键：预编辑与候选窗同步刷新&lt;/pre&gt;&lt;p class='ref'&gt;参考：composition.rs:58 / ui/candwin.rs / ui/ulw.rs&lt;/p&gt;">
    <rect x="145" y="1816" width="430" height="58"/>
    <text class="t-main" x="360" y="1840" text-anchor="middle">更新预编辑 + 候选窗重绘</text>
    <text class="t-sub" x="360" y="1858" text-anchor="middle">SetText 全量更新 · tiny-skia + ULW 呈现</text>
  </g>
</svg>
</div>

<div id="tip"></div>
<script>
  var tip = document.getElementById('tip');
  document.querySelectorAll('.node').forEach(function (n) {
    var html = n.getAttribute('data-tip');
    n.addEventListener('mouseenter', function () {
      tip.innerHTML = html;
      tip.style.display = 'block';
    });
    n.addEventListener('mousemove', function (e) {
      var pad = 14;
      var x = e.clientX + pad, y = e.clientY + pad;
      var r = tip.getBoundingClientRect();
      if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
      if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    });
    n.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
  });
</script>
</body>
</html>
