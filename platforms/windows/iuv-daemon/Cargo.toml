[package]
name = "iuv-daemon"
version = "0.1.0"
edition.workspace = true
# eframe 0.36 MSRV = 1.95（workspace 声明 1.89 是 M4 前的下限；daemon 单独抬升）。
rust-version = "1.95"
license.workspace = true
description = "iuv 输入法守护进程：唯一持有用户库 + 共享段发布 + 命名管道 IPC + 托盘 + 设置页（M6）"

[[bin]]
name = "iuv-daemon"
path = "src/main.rs"

[dependencies]
iuv-data = { workspace = true }
iuv-ui = { workspace = true }
windows = { workspace = true }
windows-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# eframe 0.36.1（2026-08 crates.io 最新稳定；默认 features = glow 渲染后端）。
# egui 由 eframe 重导出（eframe::egui），版本一致锁定，无需另列。
eframe = "0.36"